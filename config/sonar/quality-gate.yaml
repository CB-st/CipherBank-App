name: CipherBank New Code Gate
scope: new_code
# Active set matches the live CAYC gate on sonar.cipherbank.money (PR #33):
# new_duplicated_lines_density and new_violations only. Coverage is not on that
# PR gate; restore it in the same change that adds the condition on the server.
# YAML-only uncommenting fails scripts/verify-sonar-quality-gate.py.
conditions:
  duplicated_lines_density:
    operator: greater_than
    error_threshold: 3
  violations:
    operator: greater_than
    error_threshold: 0
