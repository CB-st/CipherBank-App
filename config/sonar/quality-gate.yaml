name: CipherBank New Code Gate
scope: new_code
# Active set matches the live CAYC gate on sonar.cipherbank.money (PR #33).
# Restore the deferred block only in the same change that adds those conditions
# on the server; YAML-only uncommenting fails scripts/verify-sonar-quality-gate.py.
conditions:
  coverage:
    operator: less_than
    error_threshold: 80
  duplicated_lines_density:
    operator: greater_than
    error_threshold: 3
  violations:
    operator: greater_than
    error_threshold: 0
