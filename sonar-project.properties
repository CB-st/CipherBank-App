########################################################################
# SonarQube project configuration for CipherBank-App (.NET / MAUI)
#
# Styled after CipherBank-src. When changing this file: remember that
# sonar-project.properties is read from the PR HEAD by the scanner, not
# from the base branch. A malicious PR can edit these values. Treat
# SonarQube output as *additional* signal for AI review, not ground truth.
########################################################################

### Project identity ###################################################

# Must match the project key the SRE provisioned on the server. Replace
# this placeholder once the SonarQube project exists.
sonar.projectKey = CB-st_CipherBank-App_6f7fd196-021a-4b20-a3f2-9094fa18ab2c
sonar.projectName = CipherBank App

### Source layout ######################################################

# Portable libraries + MAUI host. Until the Sonar job builds the MAUI
# project on Linux (Android workloads), only Core / ChallengePass /
# Tests are compiled under SonarScanner for .NET; host sources still
# appear in the properties tree for when that build lands.
sonar.sources = \
  CipherBank-app, \
  CipherBank-app.Core, \
  CipherBank-app.ChallengePass

sonar.tests = \
  CipherBank-app.Tests, \
  CipherBank-app.IntegrationTests, \
  CipherBank-app.E2ETests

sonar.exclusions = \
  **/bin/**, \
  **/obj/**, \
  **/Platforms/**, \
  **/Resources/**, \
  design_handoff_cipherbank/**, \
  .cursor/**, \
  reports/**

sonar.test.exclusions = \
  **/bin/**, \
  **/obj/**

### Language / encoding ################################################

sonar.sourceEncoding = UTF-8

### Coverage (optional until a build job uploads reports) ##############

# Prefer OpenCover when available; Cobertura is accepted as a fallback
# once coverlet emits into reports/ from CI.
sonar.cs.opencover.reportsPaths = reports/coverage.opencover.xml
sonar.cs.cobertura.reportsPaths = \
  reports/coverage.cobertura.xml, \
  CipherBank-app.Tests/coverage/coverage.cobertura.xml

sonar.coverage.exclusions = \
  **/Platforms/**, \
  **/Resources/**, \
  **/*Tests*/**, \
  design_handoff_cipherbank/**

### SCM ################################################################

sonar.scm.provider = git
