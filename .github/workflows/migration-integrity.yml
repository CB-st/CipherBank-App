name: Migration Integrity

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  generated-migrations:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x

      - name: Restore migration tooling
        run: dotnet restore CipherBank-app.Tests/CipherBank-app.Tests.csproj

      - name: Verify generated migration integrity
        run: ./scripts/verify-generated-migrations.sh "origin/${{ github.base_ref }}"
